[package]
name = "btsnoop_parser"
version = "1.0.0"
edition = "2024"
authors = ["nullstring1 <daniel@nullstring.one>"]
description = "Rust parser for the btsnoop format"
repository = "https://github.com/nullstring/btsnoop_parser"
readme = "README.md"
keywords = ["parser", "bluetooth", "btsnoop", "android", "GATT"]
categories = ["parsing"]
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }

[target.'aarch64-linux-android'.dependencies]
jni = "0.21.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
